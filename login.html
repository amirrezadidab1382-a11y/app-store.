<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نم</title>
    <link rel="stylesheet" href="تنظیمات سی اس اس .css">
      <style>
           *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
        }
        .form{
            width: 340px;
        }
        .card{
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow:0 15px 35px rgba(0,0,0,0.25);
            transition: 0.3s;               
        }
        .card:hover{
            transform: translateY(-5px);
        }
        h1{
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            color: #222;
        }
        .input{
            width: 100%;
            height: 45px;
            padding:0 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }
        .input:focus{
            border-color: #999;
        }
        .button{
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 8px;
            background-color: #667eea;;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .button:hover{
            background:#5568d8 ;
            transform: translateY((0));
        }
        .button:active{
            transform: translateY(0);
        }
        .links{
            margin-top: 18px;
            text-align: center;
        }
        .links a{
            color: #667eea;;
            text-decoration: none;
            font-weight: 14px;
        }
        .links a :hover{
            text-decoration: underline;
        }
        .nav-link{
            transition: 0.3s;
            background-color: white;
            text-align: center;

        }
        .nav-link:hover{
            font-size: 24px;
        }
    </style>
</head>
<body>
    <main>
                <nav class="desktop-nav">
                <a
                    href="خانه.html"
                    class="nav-link"
                >
                 برگرد به بخش خانه
                </a>
        </nav>
<form class="form"> 
    <div class="card"> 
    <h1>Login</h1> 
    <input type="text" class="input" placeholder="Username" > 
    <input type="password" class="input" placeholder="Password" > 
    <button type="submit" class="button">Login</button> <div class="links"> 
    <a href="#">Forgot password?</a> 
</div> 
</div> 
</form>
</main>
